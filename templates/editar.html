{% extends "base.html" %}
{% block title %}Editar gasto · Control de Gastos{% endblock %}
{% block content %}
<h1>Editar gasto</h1>
<section class="card narrow">
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label for="fecha">Fecha</label>
    <input id="fecha" name="fecha" type="date" value="{{ gasto.fecha }}" required>
    <label for="descripcion">Descripción</label>
    <input id="descripcion" name="descripcion" type="text" maxlength="120" value="{{ gasto.descripcion }}" required>
    <label for="monto">Monto (S/)</label>
    <input id="monto" name="monto" type="number" step="0.01" min="0.01" value="{{ '%.2f'|format(gasto.monto) }}" required>
    <div class="btn-row">
      <button class="btn btn-primary" type="submit">Guardar cambios</button>
      <a class="btn btn-ghost" href="{{ url_for('gastos') }}">Cancelar</a>
    </div>
  </form>
</section>
{% endblock %}
