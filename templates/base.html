<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Control de Gastos{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  {% if session.user_id %}
  <header class="topbar no-print">
    <div class="brand">💼 Control de Gastos</div>
    <nav>
      <a href="{{ url_for('gastos') }}" class="{{ 'active' if request.endpoint in ('gastos','gasto_editar') }}">Gastos</a>
      <a href="{{ url_for('reporte') }}" class="{{ 'active' if request.endpoint == 'reporte' }}">Reporte</a>
    </nav>
    <form method="post" action="{{ url_for('logout') }}" class="logout">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <span class="user">{{ session.username }}</span>
      <button class="btn btn-ghost" type="submit">Cerrar sesión</button>
    </form>
  </header>
  {% endif %}

  <main class="container">
    {% with mensajes = get_flashed_messages(with_categories=true) %}
      {% for categoria, mensaje in mensajes %}
        <div class="alert alert-{{ categoria }}">{{ mensaje }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
